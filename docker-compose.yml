services:
  postgres:
    image: postgres:16-alpine
    container_name: miracle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miracle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miracle_password}
      POSTGRES_DB: ${POSTGRES_DB:-miracle_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miracle_user -d miracle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
